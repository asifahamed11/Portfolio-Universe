name: Deploy Firestore rules

on:
  push:
    branches: ["main"]
    paths:
      - ".firebaserc"
      - "firebase.json"
      - "firestore.indexes.json"
      - "firestore.rules"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Deploy validated security rules
        run: npx firebase deploy --only firestore:rules --project portfolio-universe --non-interactive
