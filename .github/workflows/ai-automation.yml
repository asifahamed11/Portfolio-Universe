name: Portfolio data refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: portfolio-data-refresh
  cancel-in-progress: false

jobs:
  prepare_data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Import upstream portfolios
        run: npm run update:data

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Import pending user submissions
        run: npm run import:submissions

      - run: npm run validate:data

      - uses: actions/upload-artifact@v4
        with:
          name: prepared-portfolios
          path: src/data/portfolios.json
          if-no-files-found: error
          retention-days: 1

  enrich:
    needs: prepare_data
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pipeline_result: ${{ steps.enrichment.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: prepared-portfolios
          path: src/data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r scripts/requirements.txt

      - name: Install isolated browser
        run: python -m playwright install --with-deps chromium

      - name: Enrich validated portfolio data
        id: enrichment
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATA_FILE: src/data/portfolios.json
          BATCH_SIZE: "150"
          MIN_SUCCESS_RATE: "0.20"
        run: python scripts/hybrid_pipeline.py

      - run: node scripts/validate-portfolios.js

      - uses: actions/upload-artifact@v4
        with:
          name: enriched-portfolios
          path: src/data/portfolios.json
          if-no-files-found: error
          retention-days: 1

  persist:
    needs: enrich
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          name: enriched-portfolios
          path: src/data

      - name: Commit validated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/portfolios.json
          if git diff --cached --quiet; then
            echo "No portfolio data changed."
            exit 0
          fi
          git commit -m "chore: refresh validated portfolio data"
          git pull --rebase origin main
          git push origin HEAD:main

  sync_firestore:
    needs: persist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Reconcile Firestore from committed JSON
        env:
          RECONCILE_DELETIONS: "true"
        run: npm run sync:firestore

  quality_gate:
    needs: [enrich, persist, sync_firestore]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require a healthy enrichment and persistence run
        if: >-
          needs.enrich.outputs.pipeline_result != 'success' ||
          needs.persist.result != 'success' ||
          needs.sync_firestore.result != 'success'
        run: |
          echo "Portfolio refresh failed its quality gate."
          echo "Enrichment: ${{ needs.enrich.outputs.pipeline_result }}"
          echo "Persistence: ${{ needs.persist.result }}"
          echo "Firestore sync: ${{ needs.sync_firestore.result }}"
          exit 1
