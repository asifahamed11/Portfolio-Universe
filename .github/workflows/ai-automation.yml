name: Validate, Maintain Data, and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions: {}

concurrency:
  group: "portfolio-universe-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  validate_rules:
    name: Validate Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Node dependencies
        run: npm ci

      - name: Run Firestore rules emulator tests
        run: >-
          npx --yes firebase-tools@15.24.0 emulators:exec
          --only firestore
          --project demo-portfolio-universe
          "npm run test:rules"

  validate_site:
    name: Test and build requested revision
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run Astro diagnostics
        run: npm run check

      - name: Build Astro project
        env:
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
        run: |
          if [ -z "$PUBLIC_FIREBASE_API_KEY" ]; then
            echo "PUBLIC_FIREBASE_API_KEY is required." >&2
            exit 1
          fi
          npm run build

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run Python retry-state tests
        run: python -m unittest scripts/test_pipeline_state.py

      - name: Validate generated HTML
        run: python scripts/static-html-check.py dist/index.html

      - name: Upload requested-revision Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist

  data_maintenance:
    name: Scheduled data maintenance
    needs: [validate_rules, validate_site]
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      final_sha: ${{ steps.final_revision.outputs.sha }}

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Fetch and normalize upstream portfolios
        run: npm run update-data

      - name: Import pending user submissions
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: npm run process-submissions

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run hybrid AI pipeline
        timeout-minutes: 25
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATA_FILE: src/data/portfolios.json
          BATCH_SIZE: "150"
        run: python scripts/hybrid_pipeline.py

      - name: Checkpoint private submission review state
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: npm run process-submissions -- --checkpoint

      - name: Verify main has not advanced
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            echo "main advanced during maintenance; refusing privileged publication from stale code." >&2
            exit 1
          fi

      - name: Publish validated data and reconcile counters
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          ALLOW_FIRESTORE_PRUNE: "1"
        run: npm run migrate-data -- --prune

      - name: Export current Firestore views
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          ALLOW_FIRESTORE_EXPORT: "1"
        run: npm run sync-data

      - name: Prepare public portfolio snapshot
        run: npm run process-submissions -- --prepare-public

      - name: Commit public maintenance data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if git diff --quiet -- src/data/portfolios.json; then
            echo "Public portfolio data is already current."
          else
            git add src/data/portfolios.json
            git commit -m "chore: refresh portfolio data"
          fi
          git push origin HEAD:main

      - name: Restore private review state
        run: npm run process-submissions -- --restore-private

      - name: Finalize AI-reviewed submissions
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: npm run process-submissions -- --finalize

      - name: Return working data to its public form
        run: |
          npm run process-submissions -- --prepare-public
          npm run process-submissions -- --discard-private

      - name: Rebuild trusted global like totals
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: npm run rebuild-likes

      - name: Record maintained revision
        id: final_revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy_push_rules:
    name: Deploy push Firestore rules
    needs: [validate_rules, validate_site]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Deploy Firestore security rules
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: npm run deploy-rules

  deploy_push_site:
    name: Deploy requested revision
    needs: [validate_site, deploy_push_rules]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup GitHub Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  build_maintained_site:
    name: Test and build maintained revision
    needs: [data_maintenance]
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout maintained revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.data_maintenance.outputs.final_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run Astro diagnostics
        run: npm run check

      - name: Build Astro project
        env:
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
        run: |
          if [ -z "$PUBLIC_FIREBASE_API_KEY" ]; then
            echo "PUBLIC_FIREBASE_API_KEY is required." >&2
            exit 1
          fi
          npm run build

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run Python retry-state tests
        run: python -m unittest scripts/test_pipeline_state.py

      - name: Validate generated HTML
        run: python scripts/static-html-check.py dist/index.html

      - name: Upload maintained-revision Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist

  deploy_maintained_rules:
    name: Deploy maintained Firestore rules
    needs: [validate_rules, data_maintenance, build_maintained_site]
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout maintained revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.data_maintenance.outputs.final_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Deploy Firestore security rules
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: npm run deploy-rules

  deploy_maintained_site:
    name: Deploy maintained revision
    needs: [build_maintained_site, deploy_maintained_rules]
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup GitHub Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
